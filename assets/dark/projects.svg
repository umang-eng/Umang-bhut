<svg viewBox="0 0 1000 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Projects by Umang Bhut">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --dim: #AAAAAA; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --dim: #666666; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(12px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s}
    .head { font-size: 15px; fill: var(--bone); }
    .copy { font-size: 14px; fill: var(--muted); }
    .meta { font-size: 10px; fill: var(--accent); letter-spacing: 2.5px; }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
      :root { --bone: #000000; --muted: #000000; --dim: #000000; --rule: #000000; --accent: #000000; --node-bg: #FFFFFF; --core-bg: #FFFFFF; --ghost: #000000; }
  </style>

  <g class="rise a1" transform="translate(0, 0)">
    <text class="mono meta" x="48" y="42">001</text>
    <text class="mono head" x="48" y="70">PDM-AI — Predictive Maintenance for Industrial Machinery</text>
    <text class="mono copy" x="48" y="96">Built an AI system to predict failure of industrial machine parts in advance,</text>
    <text class="mono copy" x="48" y="118">addressing multi-week replacement-part delivery delays.</text>
    <text class="mono copy" x="48" y="140">Designed a futuristic dashboard for live sensor readings and an AI chatbot for maintenance.</text>
    <text class="mono meta" x="48" y="174">PYTHON · SCIKIT-LEARN · REACT</text>
  </g>

  <g class="rise a2" transform="translate(0, 180)">
    <text class="mono meta" x="48" y="42">002</text>
    <text class="mono head" x="48" y="70">AI Architect — Blueprint Maker</text>
    <text class="mono copy" x="48" y="96">Developed an AI tool that auto-generates architectural blueprints from user-entered measurements.</text>
    <text class="mono copy" x="48" y="118">Translates raw plot dimensions into structured, ready-to-use building layouts, reducing manual effort.</text>
    <text class="mono meta" x="48" y="152">PYTHON · GENERATIVE AI · COMPUTER VISION</text>
  </g>

  <g class="rise a3" transform="translate(0, 340)">
    <text class="mono meta" x="48" y="42">003</text>
    <text class="mono head" x="48" y="70">AI Startup Evaluation Engine</text>
    <text class="mono copy" x="48" y="96">AI-powered platform helping startups assess and improve cost, roadmap, and structure.</text>
    <text class="mono copy" x="48" y="118">Designed a 'Startup DNA' module to profile a startup's core strengths and gaps for founders.</text>
    <text class="mono meta" x="48" y="152">PYTHON · NLP · NEXTJS</text>
  </g>
</svg>